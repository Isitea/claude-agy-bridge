# requires-python 하한(3.11)과 개발 기준(3.14)을 함께 검증한다 (리뷰 #7).
# 하한을 낮춘 채 CI가 없으면 3.12+ 전용 문법이 조용히 들어와 배포본만 깨진다.
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: pytest
        run: uv run --python ${{ matrix.python-version }} pytest -q
      - name: ruff
        if: matrix.python-version == '3.14'
        run: uv run --python ${{ matrix.python-version }} ruff check src tests
