[tools]
# R12 실측 확정: 3.14.6에서 전 의존성 wheel 존재 + 스모크 14/14 통과 → 최상위 버전 유지.
# (3.13.14 / 3.12.13도 동일하게 전부 통과했으나 상위 버전 우선 원칙에 따라 3.14 고정)
python = "3.14"
uv = "latest"
# node는 사용하지 않는다 (§7.1) — MCP stdio 서버에 불필요, 이식 시 런타임 표면 축소.

[env]
# TLS를 가로채는 프록시 환경에서는 uv의 번들 webpki 루트만으로 CPython 다운로드가
# `invalid peer certificate: UnknownIssuer`로 실패한다. 시스템 CA 저장소를
# 신뢰 목록에 포함시켜 해결한다 (인증서 검증을 끄는 것이 아니다).
UV_SYSTEM_CERTS = "1"

[settings]
github_attestations = false
python.uv_venv_auto = "create|source"
